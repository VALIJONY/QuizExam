<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish | ExamPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Django yaratadigan inputlarni Tailwind uslubida bezash */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #d1d5db;
            outline: none;
            transition: all 0.2s;
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }
        .helptext { font-size: 0.75rem; color: #6b7280; display: block; margin-bottom: 0.5rem; }
        ul.errorlist { color: #ef4444; font-size: 0.875rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-10">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 m-4">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">Ro'yxatdan o'tish</h1>
            <p class="text-gray-500 text-sm">Platformaga a'zo bo'lish uchun ma'lumotlarni kiriting</p>
        </div>

        <form method="POST" class="space-y-2">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md mt-4">
                Tasdiqlash va Kirish
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Akkountingiz bormi? 
            <a href="{% url 'login' %}" class="text-blue-600 hover:underline font-medium">Tizimga kiring</a>
        </div>
    </div>

</body>
</html>
