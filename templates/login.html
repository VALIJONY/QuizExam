<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish | ExamPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 m-4">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">ExamPlatform</h1>
            <p class="text-gray-500 text-sm">Davlat imtihonlariga tayyorgarlik tizimi</p>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded">
            <p class="text-sm font-medium">Login yoki parol noto'g'ri. Iltimos, qaytadan urinib ko'ring.</p>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Login (O'quvchi ID)</label>
                <input type="text" name="username" id="id_username" required autofocus
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200">
            </div>

            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Parol</label>
                <input type="password" name="password" id="id_password" required
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Tizimga kirish
            </button>
             <a href="{% url 'register' %}" class="block text-center text-blue-600 hover:underline mt-4">Ro'yxatdan o'tish</a>
        </form>
       
        <div class="mt-6 text-center text-xs text-gray-400">
            &copy; 2026. Barcha huquqlar himoyalangan.
        </div>
    </div>

</body>
</html>
